services:
  trackstar:
    image: trackstar:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Created as root by the container (make dev keeps its own ./data-dev).
      - ./data:/var/lib/trackstar
    environment:
      TRACKSTAR_DATABASE_DRIVER: sqlite
      TRACKSTAR_DATABASE_URL: /var/lib/trackstar/trackstar.db
      TRACKSTAR_PUBLIC_URL: http://localhost:3000/
      # TRACKSTAR_ALLOW_REGISTRATION: "false"   # after creating your accounts
      # TRACKSTAR_TIMEZONE: Europe/Berlin
    # The image runs as root so the ./data bind mount works whoever owns it.
    # To drop root: `mkdir -p data && sudo chown 65532:65532 data`, then enable:
    # user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
